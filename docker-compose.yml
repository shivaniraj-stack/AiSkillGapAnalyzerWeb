version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: skillgap_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ai_skill_gap_analyzer
    ports:
      - "3307:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: skillgap_app
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DB_URL: "jdbc:mysql://db:3306/ai_skill_gap_analyzer?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USER: "root"
      DB_PASSWORD: "rootpassword"
      # Optional: Add your Gemini API key here or via system environment variable
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"

volumes:
  mysql_data:
